
#cloud-config

hostname: ${hostname}
manage_etc_hosts: true
timezone: America/Sao_Paulo

users:
  - default
  - name: aluno
    gecos: PI Data Science Grupo 3
    groups:
      - adm
      - sudo
    shell: /bin/bash
    sudo:
      - ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      - ${ssh_key}

ssh_pwauth: false
disable_root: true
